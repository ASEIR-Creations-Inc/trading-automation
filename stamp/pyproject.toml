[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aseir-stamp"
version = "1.0.0"
description = "Recompute and verify the settings stamp printed on ASEIR backtest and alert charts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ASEIR Creations Inc" }]

[project.scripts]
aseir-stamp = "aseir_stamp:main"

[tool.setuptools]
py-modules = ["aseir_stamp"]
